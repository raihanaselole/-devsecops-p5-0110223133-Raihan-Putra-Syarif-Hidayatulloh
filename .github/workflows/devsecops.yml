
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sast-scan:
    name: SAST Scan and Quality Gate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r app -f json -o bandit-report.json --exit-zero

      - name: Enforce Quality Gate
        run: |
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as file:
              report = json.load(file)

          findings = [
              issue for issue in report.get("results", [])
              if issue.get("issue_severity", "").upper() in ("HIGH", "MEDIUM")
          ]

          print("Total findings:", len(report.get("results", [])))
          print("High/Medium findings:", len(findings))

          for issue in findings:
              print(
                  f"{issue['issue_severity']} - "
                  f"{issue['issue_text']} "
                  f"({issue['filename']}:{issue['line_number']})"
              )

          if findings:
              print("QUALITY GATE: FAILED")
              sys.exit(1)

          print("QUALITY GATE: PASSED")
          PY
